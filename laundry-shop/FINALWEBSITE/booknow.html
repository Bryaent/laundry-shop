<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Book Now | M & M Laundry</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="booknow.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>
  <div class="header-left">
    <div id="Lugu">
      <img src="img/Logo.png" alt="Logo">
    </div>

    <div class="tagline">
      <span>FAST AND FRESH LAUNDRY JUST</span>
      <a href="click.html">
        <button>CLICK AWAY!</button>
      </a>
    </div>
  </div>

  <nav>
    <ul>
      <li><a href="index.html#Home">HOME</a></li>
      <li><a href="index.html#Franchise">FRANCHISE</a></li>
      <li><a href="index.html#Service">SERVICE</a></li>
      <li><a href="index.html#About">ABOUT US</a></li>
      <li><a href="index.html#Contact">CONTACT US</a></li>
      <li><a href="account.html" class="account-btn">ACCOUNT</a></li>
      <li><a href="#" id="logoutBtn" class="logout-btn">LOGOUT</a></li>
    </ul>
  </nav>
</header>

<main class="booknow-page">

  <section class="booknow-container">

    <div id="bookService" class="tab-content active">

      <div class="kiosk-layout">

        <!-- LEFT STEPS -->
        <div class="steps-panel">

          <div class="step-box active-step"><span>1</span><p>Select Soap</p></div>
          <div class="step-box"><span>2</span><p>Select Fabric Conditioner</p></div>
          <div class="step-box"><span>3</span><p>Select Wash Type</p></div>
          <div class="step-box"><span>4</span><p>Pickup Details</p></div>
          <div class="step-box"><span>5</span><p>Payment</p></div>
          <div class="step-box"><span>6</span><p>Confirmation</p></div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="products-panel"></div>

      </div>

    </div>

  </section>

</main>

<script src="booknow.js"></script>

<script>
document.getElementById("logoutBtn").addEventListener("click", function () {
  if (confirm("Are you sure you want to log out?")) {
    localStorage.removeItem("loggedInUser");
    window.location.href = "login.html";
  }
});
</script>

</body>
</html>
