<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Create Account | M &amp; M Laundry</title>
  <link rel="icon" type="../img/Logo.png" href="../img/Logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e8f4ff 0%, #dbeeff 50%, #c8e6ff 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 148, 255, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 119, 204, 0.10) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .container {
      position: relative;
      display: flex;
      width: 920px;
      max-width: 100%;
      min-height: 580px;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 100, 200, 0.18), 0 8px 30px rgba(0, 0, 0, 0.08);
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      flex: 1;
      background: linear-gradient(145deg, #0077cc 0%, #00a6ff 60%, #33bfff 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 50px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 280px; height: 280px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .left-panel::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 220px; height: 220px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
    }

    .left-logo-wrap {
      width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(6px);
    }

    .left-logo-wrap img {
      width: 72px; height: 72px;
      object-fit: contain;
    }

    .left-panel h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }

    .left-panel p {
      font-size: 14px;
      opacity: 0.88;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 1.1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 48px;
      background: #fff;
      overflow-y: auto;
    }

    form { width: 100%; max-width: 360px; }

    .form-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #0077cc;
      margin-bottom: 7px;
    }

    form h2 {
      font-size: 30px;
      font-weight: 800;
      color: #0d1b2e;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    /* ── INPUT GROUP ── */
    .input-group {
      margin-bottom: 13px;
      position: relative;
    }

    .input-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #0077cc;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* --- FIXED ICON WRAPPER --- */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* Icon sits absolutely inside, left side */
    .input-wrap .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: #a0b8d8;
      pointer-events: none;
      z-index: 2;
      transition: color 0.2s;
      width: 16px;
      text-align: center;
    }

    /* Input has left padding to clear the icon */
    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid rgba(0, 119, 204, 0.2);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      color: #0d1b2e;
      background: #f7faff;
      transition: all 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: #0077cc;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 119, 204, 0.1);
    }

    /* Icon turns blue on focus */
    .input-wrap:focus-within .field-icon {
      color: #0077cc;
    }

    /* Password toggle button — right side */
    .input-wrap.has-toggle input {
      padding-right: 46px;
    }

    .toggle-pw {
      position: absolute;
      right: 0;
      top: 0; bottom: 0;
      width: 46px;
      background: none;
      border: none;
      cursor: pointer;
      color: #a0b8d8;
      font-size: 15px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 12px 12px 0;
      transition: color 0.2s;
      z-index: 2;
    }

    .toggle-pw:hover { color: #0077cc; }

    /* ── REGISTER BUTTON ── */
    .register-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0077cc, #00a6ff);
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 6px;
      letter-spacing: 0.04em;
      box-shadow: 0 6px 20px rgba(0, 119, 204, 0.3);
    }

    .register-btn:hover {
      background: linear-gradient(135deg, #005fa3, #0090e0);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 119, 204, 0.4);
    }

    .register-btn:active { transform: translateY(0); }

    /* ── LOGIN LINK ── */
    .login-link {
      margin-top: 18px;
      text-align: center;
      font-size: 13.5px;
      color: #7a90a8;
    }

    .login-link a {
      color: #0077cc;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }

    .login-link a:hover {
      color: #005fa3;
      text-decoration: underline;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .container { flex-direction: column; min-height: auto; }
      .left-panel { padding: 36px 28px; }
      .right-panel { padding: 36px 28px; }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .right-panel { padding: 28px 20px; }
      form h2 { font-size: 24px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="left-logo-wrap">
        <img src="../img/Logo.png" alt="M&M Laundry Logo">
      </div>
      <h2>Join M&amp;M Laundry</h2>
      <p>Create your account and enjoy fast, fresh &amp; hassle-free laundry services.</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <form id="registerForm" method="POST">

        <div class="form-eyebrow">M &amp; M Laundry Shop</div>
        <h2>Create your<br>account</h2>

        <!-- Full Name -->
        <div class="input-group">
          <label class="input-label" for="fullname">Full Name</label>
          <div class="input-wrap">
            <i class="fas fa-user field-icon"></i>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
          </div>
        </div>

        <!-- Email -->
        <div class="input-group">
          <label class="input-label" for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope field-icon"></i>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>
        </div>

        <!-- Username -->
        <div class="input-group">
          <label class="input-label" for="username">Username</label>
          <div class="input-wrap">
            <i class="fas fa-at field-icon"></i>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <div class="input-wrap has-toggle">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            <button type="button" class="toggle-pw" id="togglePw" title="Show/hide password">
              <i class="fas fa-eye" id="togglePwIcon"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <label class="input-label" for="confirmPassword">Confirm Password</label>
          <div class="input-wrap has-toggle">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required>
            <button type="button" class="toggle-pw" id="toggleConfirmPw" title="Show/hide password">
              <i class="fas fa-eye" id="toggleConfirmPwIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="register-btn">
          <i class="fas fa-user-plus" style="margin-right:8px;"></i> Create Account
        </button>

        <p class="login-link">
          Already have an account? <a href="../HTML/login.html">Sign in here</a>
        </p>

      </form>
    </div>
  </div>

  <script>
    function togglePassword(btnId, iconId, inputId) {
      document.getElementById(btnId).addEventListener('click', function (e) {
        e.preventDefault();
        const pw = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (pw.type === 'password') {
          pw.type = 'text';
          icon.className = 'fas fa-eye-slash';
        } else {
          pw.type = 'password';
          icon.className = 'fas fa-eye';
        }
      });
    }

    togglePassword('togglePw', 'togglePwIcon', 'password');
    togglePassword('toggleConfirmPw', 'toggleConfirmPwIcon', 'confirmPassword');
  </script>
  <script src="../JS/register.js"></script>

</body>
</html>
