<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login | M &amp; M Laundry</title>
  <link rel="icon" type="../img/Logo.png" href="../img/Logo.png">
  <link rel="stylesheet" href="../CSS/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="left-logo-wrap">
        <img src="../img/Logo.png" alt="M&M Laundry Logo">
      </div>
      <h2>Welcome to M&amp;M Laundry</h2>
      <p>Fast, fresh &amp; hassle-free laundry service delivered right to your door.</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <form id="loginForm" method="POST">

        <div class="form-eyebrow">M &amp; M Laundry Shop</div>
        <h2>Sign in to<br>your account</h2>

        <div class="input-group">
          <label class="input-label" for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
            <i class="fas fa-user"></i>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <div class="input-wrap" style="position:relative;">
            <i class="fas fa-lock"
              style="position:absolute;left:14px;font-size:16px;color:#a0b8d8;pointer-events:none;z-index:1;"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required
              style="width:100%;padding:13px 46px 13px 42px;">
            <button type="button" id="togglePw" title="Show/hide password" style="position:absolute;right:0;top:0;bottom:0;width:46px;
             background:none;border:none;cursor:pointer;color:#a0b8d8;
             font-size:16px;z-index:2;display:flex;align-items:center;justify-content:center;
             border-radius:0 12px 12px 0;">
              <i class="fas fa-eye" id="togglePwIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> Login
        </button>

        

        <div class="register-wrap">
          Don't have an account?
          <a href="../HTML/register.html">Create one here</a>
        </div>

      </form>
    </div>
  </div>

  <script>
    document.getElementById('togglePw').addEventListener('click', function (e) {
      e.preventDefault();
      const pw = document.getElementById('password');
      const icon = document.getElementById('togglePwIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'fas fa-eye';
      }
    });
  </script>
  <script src="../JS/login.js"></script>
</body>

</html>
