<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Your Laundry</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- FIXED HEADER - MATCHES INDEX.HTML -->
  <header>
    <div class="header-left">
      <div id="Lugu">
        <img src="../img/Logo.png" alt="Logo">
      </div>
      <div class="tagline">
        <span>FAST AND FRESH LAUNDRY JUST</span>
        <a href="../HTML/booknow.html">
          <button>CLICK AWAY!</button>
        </a>
      </div>
    </div>
    <nav>
      <ul>
        <li><a href="../HTML/index.html">HOME</a></li>
        <li><a href="../HTML/franchise.html">FRANCHISE</a></li>
        <li><a href="../HTML/service.html">SERVICE</a></li>
        <li><a href="../HTML/about.html">ABOUT US</a></li>
        <li><a href="../HTML/contact.html">CONTACT US</a></li>
        <li><a href="../HTML/account.html" class="account-btn active">ACCOUNT</a></li>
        <li><a href="#" id="logoutBtn" class="logout-btn">LOGOUT</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <div class="tracklaundry-page">
    <div class="track-container">
      <a href="../HTML/booknow.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Booking
      </a>
      <h2>Track Your Laundry</h2>
      <p>Enter your ticket number to check your order status.</p>

      <form id="trackForm">
        <input type="text" id="ticketInput" placeholder="Enter ticket number" required>
        <br>
        <button type="submit">Track Order</button>
      </form>

      <div id="trackResult"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../JS/web.js"></script>
  <script>
    // TRACK LAUNDRY FUNCTIONALITY
    const form = document.getElementById("trackForm");
    const resultBox = document.getElementById("trackResult");

    // AUTO TICKET FROM URL
    const params = new URLSearchParams(window.location.search);
    const autoTicket = params.get("ticket");

    if (autoTicket) {
      document.getElementById("ticketInput").value = autoTicket;
    }

    // TRACK FORM SUBMISSION
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const code = document.getElementById("ticketInput").value.trim();
      const orders = JSON.parse(localStorage.getItem("orders")) || [];
      const match = orders.find(o => o.ticket === code);

      resultBox.style.display = "block";

      if (match) {
        resultBox.innerHTML = `
          <div class="track-success">
            <h3><i class="fas fa-check-circle"></i> Order Found!</h3>
            <div class="track-details">
              <p><strong>Ticket:</strong> ${match.ticket}</p>
              <p><strong>Name:</strong> ${match.name}</p>
              <p><strong>Address:</strong> ${match.address}</p>
              <p><strong>Service:</strong> ${match.service}</p>
              <p><strong>Soap:</strong> ${match.soap}</p>
              <p><strong>Fabcon:</strong> ${match.fabcon}</p>
              <p><strong>Payment:</strong> ${match.payment}</p>
              <p><strong>Amount:</strong> ₱${match.amount}</p>
              <p><strong>Status:</strong> 
                <span class="status-badge ${match.status.toLowerCase()}">${match.status}</span>
              </p>
            </div>
          </div>
        `;
      } else {
        resultBox.innerHTML = `
          <div class="track-error">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>No Record Found</h3>
            <p>Please check your ticket number and try again.</p>
          </div>
        `;
      }
    });

    // AUTO TRACK IF TICKET IN URL
    if (autoTicket) {
      form.dispatchEvent(new Event("submit"));
    }
  </script>

  <style>
    /* TRACK LAUNDRY PAGE SPECIFIC STYLES */
    .tracklaundry-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      padding: 180px 20px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-container {
      background: white;
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .track-container h2 {
      font-size: 36px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #3ba7ff, #0094ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .track-container p {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* BACK BUTTON */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0094ff, #0077cc);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 8px 25px rgba(0,148,255,0.3);
      transition: all 0.3s ease;
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .back-btn:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 35px rgba(0,148,255,0.4);
    }

    /* INPUT */
    #ticketInput {
      width: 100%;
      padding: 20px 25px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 16px;
      margin-bottom: 25px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
      background: #fafbff;
    }

    #ticketInput:focus {
      outline: none;
      border-color: #0094ff;
      box-shadow: 0 0 0 4px rgba(0,148,255,0.1);
      transform: translateY(-2px);
    }

    /* BUTTON */
    button[type="submit"] {
      background: linear-gradient(135deg, #3ba7ff, #0094ff);
      color: white;
      border: none;
      padding: 18px 40px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(59,167,255,0.3);
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(59,167,255,0.4);
    }

    /* RESULT STYLES */
    #trackResult {
      margin-top: 30px;
      display: none;
    }

    .track-success,
    .track-error {
      padding: 30px;
      border-radius: 20px;
      text-align: left;
    }

    .track-success {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 2px solid #bbf7d0;
    }

    .track-error {
      background: linear-gradient(135deg, #fef2f2 0%, #fecaca 100%);
      border: 2px solid #fca5a5;
      color: #dc2626;
    }

    .track-success h3,
    .track-error h3 {
      color: #166534;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .track-error h3 {
      color: #dc2626;
    }

    .track-error i {
      color: #f87171;
      font-size: 24px;
    }

    .track-details p {
      margin-bottom: 12px;
      font-size: 15px;
      color: #374151;
      display: flex;
      justify-content: space-between;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-badge.pending {
      background: #fef3c7;
      color: #d97706;
    }

    .status-badge.processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-badge.completed {
      background: #d1fae5;
      color: #059669;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .tracklaundry-page {
        padding: 160px 15px 30px;
      }
      
      .track-container {
        padding: 40px 30px;
        margin: 0 10px;
      }
      
      .track-container h2 {
        font-size: 28px;
      }
    }
  </style>
</body>
</html>
