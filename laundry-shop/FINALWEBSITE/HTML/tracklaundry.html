<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Track Your Laundry</title>
  <link rel="icon" type="../img/Logo.png" href="../img/Logo.png">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- HEADER — matches index.html -->
  <header>
    <div class="header-left">
      <img src="../img/Logo.png" alt="M&M Laundry">
      <div class="header-tagline">
        <span class="header-tagline-text">FAST AND FRESH LAUNDRY JUST</span>
        <a href="../HTML/booknow.html" style="text-decoration:none;">
          <span class="header-tagline-pill">CLICK AWAY!</span>
        </a>
      </div>
    </div>
    <nav>
      <ul>
        <li><a href="../HTML/index.html">HOME</a></li>
        <li><a href="../HTML/index.html#Franchise">FRANCHISE</a></li>
        <li><a href="../HTML/index.html#Service">SERVICE</a></li>
        <li><a href="../HTML/index.html#About">ABOUT US</a></li>
        <li><a href="../HTML/index.html#Contact">CONTACT US</a></li>
        <li><a href="../HTML/account.html" class="account-btn">ACCOUNT</a></li>
        <li><a href="#" id="logoutBtn" class="logout-btn">LOGOUT</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <div class="tracklaundry-page">

    <div class="track-container">

      <!-- BACK BUTTON -->
      <button class="track-back-btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> Back
      </button>

      <!-- ICON -->
      <div class="track-icon-wrap">
        <i class="fas fa-tshirt"></i>
      </div>

      <h2>Track Your Laundry</h2>
      <p>Enter your ticket number to check your order status.</p>

      <form id="trackForm">
        <div class="track-input-wrap">
          <i class="fas fa-ticket-alt"></i>
          <input type="text" id="ticketInput" placeholder="Enter ticket number" required>
        </div>
        <button type="submit" class="track-submit-btn">
          <i class="fas fa-search"></i> Track Order
        </button>
      </form>

      <div id="trackResult"></div>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../JS/web.js"></script>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", function (e) {
      e.preventDefault();
      if (confirm("Are you sure you want to log out?")) {
        localStorage.removeItem("loggedInUser");
        window.location.href = "../HTML/login.html";
      }
    });

    const form = document.getElementById("trackForm");
    const resultBox = document.getElementById("trackResult");

    const params = new URLSearchParams(window.location.search);
    const autoTicket = params.get("ticket");
    if (autoTicket) {
      document.getElementById("ticketInput").value = autoTicket;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const code = document.getElementById("ticketInput").value.trim();
      const orders = JSON.parse(localStorage.getItem("orders")) || [];
      const match = orders.find(o => o.ticket === code);

      resultBox.style.display = "block";

      if (match) {
        resultBox.innerHTML = `
          <div class="track-success">
            <h3><i class="fas fa-check-circle"></i> Order Found!</h3>
            <div class="track-details">
              <div class="track-row"><span class="track-label">Ticket</span><span class="track-value">${match.ticket}</span></div>
              <div class="track-row"><span class="track-label">Name</span><span class="track-value">${match.name}</span></div>
              <div class="track-row"><span class="track-label">Address</span><span class="track-value">${match.address}</span></div>
              <div class="track-row"><span class="track-label">Service</span><span class="track-value">${match.service}</span></div>
              <div class="track-row"><span class="track-label">Soap</span><span class="track-value">${match.soap}</span></div>
              <div class="track-row"><span class="track-label">Fabcon</span><span class="track-value">${match.fabcon}</span></div>
              <div class="track-row"><span class="track-label">Payment</span><span class="track-value">${match.payment}</span></div>
              <div class="track-row"><span class="track-label">Amount</span><span class="track-value">₱${match.amount}</span></div>
              <div class="track-row">
                <span class="track-label">Status</span>
                <span class="status-badge ${match.status.toLowerCase()}">${match.status}</span>
              </div>
            </div>
          </div>
        `;
      } else {
        resultBox.innerHTML = `
          <div class="track-error">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>No Record Found</h3>
            <p>Please check your ticket number and try again.</p>
          </div>
        `;
      }
    });

    if (autoTicket) {
      form.dispatchEvent(new Event("submit"));
    }
  </script>

  <style>
    /* ===== TRACK LAUNDRY PAGE ===== */
    .tracklaundry-page {
      min-height: 100vh;
      background:
        linear-gradient(rgba(6, 43, 69, 0.92), rgba(11, 79, 125, 0.92)),
        url("../img/Home-Background.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 120px 20px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(77, 201, 255, 0.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 55px 50px 50px;
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    /* BACK BUTTON */
    .track-back-btn {
      position: absolute;
      top: 22px;
      left: 24px;
      background: rgba(77, 201, 255, 0.1);
      color: #4dc9ff;
      border: 1px solid rgba(77, 201, 255, 0.3);
      padding: 9px 18px;
      border-radius: 50px;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.25s ease;
    }

    .track-back-btn:hover {
      background: rgba(77, 201, 255, 0.2);
      border-color: rgba(77, 201, 255, 0.55);
      color: #fff;
      transform: translateX(-3px);
    }

    /* ICON CIRCLE */
    .track-icon-wrap {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #00bfff, #4dc9ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 26px;
      box-shadow: 0 12px 30px rgba(0, 191, 255, 0.35);
    }

    .track-icon-wrap i {
      font-size: 28px;
      color: #fff;
    }

    /* HEADING */
    .track-container h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .track-container>p {
      font-family: 'Barlow', sans-serif;
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    /* INPUT WRAPPER */
    .track-input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .track-input-wrap i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #4dc9ff;
      font-size: 16px;
    }

    #ticketInput {
      width: 100%;
      padding: 17px 22px 17px 50px;
      border: 1.5px solid rgba(77, 201, 255, 0.25);
      border-radius: 14px;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      background: rgba(6, 43, 69, 0.65);
      color: #ffffff;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    #ticketInput::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    #ticketInput:hover {
      border-color: rgba(77, 201, 255, 0.45);
      background: rgba(6, 43, 69, 0.8);
    }

    #ticketInput:focus {
      outline: none;
      border-color: #4dc9ff;
      background: rgba(6, 43, 69, 0.9);
      box-shadow: 0 0 0 4px rgba(77, 201, 255, 0.12);
    }

    /* SUBMIT BUTTON */
    .track-submit-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #00bfff, #4dc9ff);
      color: #fff;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      box-shadow: 0 10px 28px rgba(0, 191, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .track-submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.45s;
    }

    .track-submit-btn:hover::before {
      left: 100%;
    }

    .track-submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0, 191, 255, 0.45);
    }

    /* RESULT BOX */
    #trackResult {
      margin-top: 28px;
      display: none;
    }

    /* SUCCESS RESULT */
    .track-success {
      background: rgba(6, 43, 69, 0.7);
      border: 1px solid rgba(77, 201, 255, 0.3);
      border-radius: 18px;
      padding: 28px 30px;
      text-align: left;
      backdrop-filter: blur(10px);
    }

    .track-success h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #4dc9ff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(77, 201, 255, 0.1);
      font-family: 'Barlow', sans-serif;
    }

    .track-row:last-child {
      border-bottom: none;
    }

    .track-label {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .track-value {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      text-align: right;
      max-width: 60%;
    }

    /* ERROR RESULT */
    .track-error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 18px;
      padding: 32px 28px;
      text-align: center;
    }

    .track-error>i {
      font-size: 36px;
      color: #f87171;
      margin-bottom: 14px;
      display: block;
    }

    .track-error h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #fca5a5;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .track-error p {
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      color: rgba(252, 165, 165, 0.75);
      margin: 0;
    }

    /* STATUS BADGES */
    .status-badge {
      padding: 5px 14px;
      border-radius: 50px;
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge.pending {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .status-badge.processing {
      background: rgba(77, 201, 255, 0.15);
      color: #4dc9ff;
      border: 1px solid rgba(77, 201, 255, 0.3);
    }

    .status-badge.completed {
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    /* RESPONSIVE */
    @media (max-width: 560px) {
      .tracklaundry-page {
        padding: 100px 16px 40px;
      }

      .track-container {
        padding: 50px 24px 36px;
      }

      .track-container h2 {
        font-size: 34px;
      }
    }
  </style>

</body>

</html>
