<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account</title>
  <link rel="stylesheet" href="../CSS/account.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-left">
      <div id="Lugu">
        <img src="../img/Logo.png" alt="Logo">
      </div>
      <div class="tagline">
        <span>FAST AND FRESH LAUNDRY JUST</span>
          <a href="../HTML/booknow.html">
          <button>CLICK AWAY!</button>
        </a>
      </div>
    </div>
<nav>
      <ul>
<li><a href="../HTML/index.html">HOME</a></li>
<li><a href="../HTML/index.html#franchise">FRANCHISE</a></li>
<li><a href="../HTML/index.html#service">SERVICE</a></li>
<li><a href="../HTML/index.html#about">ABOUT US</a></li>
<li><a href="../HTML/index.html#contact">CONTACT US</a></li>
<li><a href="../HTML/index.html#contact" class="account-btn active">ACCOUNT</a></li>
<li><a href="#" id="logoutBtn" class="logout-btn">LOGOUT</a></li>
    </nav>
  </header>

  <!-- ===== MAIN ACCOUNT SECTION ===== -->
  <section class="account-container">
    <div class="account-card">
      <h2>My Account</h2>
      <div class="profile-pic">
  <img id="profileImage" src="" alt="Profile Picture" style="display:none;">
  <div id="noProfileText">No Profile Picture</div>

  <input
    type="file"
    id="profileUpload"
    accept="image/*"
    style="margin-top: 10px;"
  >
</div>

        <div class="details">
          <p><strong>Name:</strong> <span id="accName">Customer Name</span></p>
          <p><strong>Username:</strong> <span id="accUsername">username</span></p>
          <p><strong>Email:</strong> <span id="accEmail">customer@email.com</span></p>
          <p><strong>Contact:</strong> <span id="accContact">0912 345 6789</span></p>
          <p><strong>Address:</strong> <span id="accAddress">123 Laundry Street, City</span></p>
        </div>
      </div>

      <div class="account-actions">
        <button id="editBtn" class="btn">Edit Info</button>
        <button id="saveBtn" class="btn hidden">Save Changes</button>
      </div>
    </div>
  </section>

  <script>
// Load user data from account.php
fetch("../PHP/account.php")
  .then(response => response.json())
  .then(data => {
    console.log(data);

    if (data.status === "success") {

      // Display user information from database
      document.getElementById("accName").textContent = data.fullname;
      document.getElementById("accEmail").textContent = data.email;
      document.getElementById("accContact").textContent = data.contact;
      document.getElementById("accAddress").textContent = data.address;

    } else {
      alert("Please login first.");
      window.location.href = "../HTML/login.html";
    }
  })
  .catch(error => {
    console.error(error);
    alert("Error loading account information.");
  });


// Logout button
document.getElementById("logoutBtn").addEventListener("click", function(e) {
  e.preventDefault();

  if (confirm("Are you sure you want to log out?")) {
    fetch("../PHP/logout.php")
      .then(() => {
        localStorage.removeItem("loggedInUser");
        window.location.href = "../HTML/login.html";
      })
      .catch(() => {
        window.location.href = "../HTML/login.html";
      });
  }
});


// Edit / Save toggle
const editBtn = document.getElementById("editBtn");
const saveBtn = document.getElementById("saveBtn");
const detailsDiv = document.querySelector(".details");

editBtn.addEventListener("click", () => {
  detailsDiv.querySelectorAll("span").forEach(span => {
    const val = span.textContent;
    const input = document.createElement("input");
    input.value = val;
    span.replaceWith(input);
  });

  editBtn.classList.add("hidden");
  saveBtn.classList.remove("hidden");
});

saveBtn.addEventListener("click", () => {
  const inputs = detailsDiv.querySelectorAll("input");

  const updatedUser = {
    name: inputs[0].value,
    email: inputs[1].value,
    contact: inputs[2].value,
    address: inputs[3].value
  };

  // Save updated data to database
  fetch("../PHP/update_account.php", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(updatedUser)
  })
  .then(response => response.json())
  .then(data => {

    if (data.status === "success") {

      // Replace inputs with spans again
      inputs.forEach((input, i) => {
        const span = document.createElement("span");
        span.textContent = Object.values(updatedUser)[i];
        input.replaceWith(span);
      });

      // Optional localStorage backup
      localStorage.setItem("loggedInUser", JSON.stringify(updatedUser));

      editBtn.classList.remove("hidden");
      saveBtn.classList.add("hidden");

      alert("Profile updated successfully!");

    } else {
      alert("Failed to update profile.");
    }

  })
  .catch(error => {
    console.error(error);
    alert("Error updating profile.");
  });
});
</script>
<script>
// ================================
// LOAD USER DATA
// ================================
const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user) {
  alert("Please login first.");
  window.location.href = "../HTML/login.html";
}

// Display user info
document.getElementById("accName").textContent =
  user.fullname || user.name || "No Name";

document.getElementById("accUsername").textContent =
  user.username || "No Username";

document.getElementById("accEmail").textContent =
  user.email || "No Email";

document.getElementById("accContact").textContent =
  user.contact || "";

document.getElementById("accAddress").textContent =
  user.address || "";


// ================================
// PROFILE PICTURE LOAD
// ================================
const profileImage = document.getElementById("profileImage");
const noProfileText = document.getElementById("noProfileText");

if (user.profilePicture) {
  profileImage.src = user.profilePicture;
  profileImage.style.display = "block";
  noProfileText.style.display = "none";
}


// ================================
// PROFILE PICTURE UPLOAD
// ================================
document.getElementById("profileUpload").addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (e) {
    const imageData = e.target.result;

    profileImage.src = imageData;
    profileImage.style.display = "block";
    noProfileText.style.display = "none";

    user.profilePicture = imageData;
    localStorage.setItem("loggedInUser", JSON.stringify(user));

    alert("Profile picture updated successfully!");
  };

  reader.readAsDataURL(file);
});


// ================================
// LOGOUT
// ================================
document.getElementById("logoutBtn").addEventListener("click", function (e) {
  e.preventDefault();

  if (confirm("Are you sure you want to log out?")) {
    localStorage.removeItem("loggedInUser");
    window.location.href = "../HTML/login.html";
  }
});
</script>
</body>
</html>
